server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve the backend via Docker's embedded DNS so a backend restart
    # (which gives it a new container IP) doesn't leave nginx with a stale one.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API -> backend
    location /api/ {
        set $backend backend;
        proxy_pass http://$backend:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # report/PDF generation can be slow
    }

    # Health check -> backend
    location = /health {
        set $backend_health backend;
        proxy_pass http://$backend_health:5001/health;
    }

    # Long-cache hashed build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: always fall back to index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
