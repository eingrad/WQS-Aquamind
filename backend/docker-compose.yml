version: "3.8"

services:
  # PostgreSQL with TimescaleDB Extension
  database:
    image: timescale/timescaledb:latest-pg15
    container_name: petronas-db
    environment:
      POSTGRES_USER: petronas
      POSTGRES_PASSWORD: secure_password_change_me
      POSTGRES_DB: petronas_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - petronas-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petronas"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: petronas-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - petronas-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # MQTT Broker (Eclipse Mosquitto) - Optional, for Week 8
  mqtt:
    image: eclipse-mosquitto:2
    container_name: petronas-mqtt
    ports:
      - "1883:1883" # MQTT
      - "9001:9001" # WebSocket
    volumes:
      - ./mqtt/config:/mosquitto/config
      - mqtt_data:/mosquitto/data
      - mqtt_logs:/mosquitto/log
    networks:
      - petronas-network
    restart: unless-stopped
    # Uncomment when ready to use MQTT
    # profiles:
    #   - mqtt

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  mqtt_data:
    driver: local
  mqtt_logs:
    driver: local

networks:
  petronas-network:
    driver: bridge
