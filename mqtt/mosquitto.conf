# Production Mosquitto config for AquaMind.
# per_listener_settings lets the internal and external listeners differ.
per_listener_settings true

# ── Internal native-MQTT listener (Docker network only) ──
# Used by the backend; not published to the host, so anonymous is safe.
listener 1883
allow_anonymous true

# ── WebSocket listener for remote devices (e.g. the Raspberry Pi) ──
# Reached only via the Cloudflare Tunnel: wss://mqtt.<domain> -> here.
# Cloudflare terminates TLS at its edge, so traffic arrives as plain ws —
# no certificate is needed here. Require a username/password (the device
# logins created in the passwd file).
listener 9001
protocol websockets
allow_anonymous false
password_file /mosquitto/config/passwd
# Per-device topic isolation: each login may publish ONLY to its own topic
# (the topic segment must equal the device's MQTT username). See mqtt/acl.
acl_file /mosquitto/config/acl
